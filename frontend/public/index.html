<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlists Lister</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        #loginBtn {
            width: 100%;
            padding: 12px;
            background: #1DB954;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        #loginBtn:hover {
            background: #1ed760;
        }

        #loginBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #playlistContainer {
            margin-top: 30px;
            display: none;
        }

        .user-info {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        #playlistList {
            background: #f7f7f7;
            padding: 0;
            border-radius: 8px;
            font-size: 14px;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
        }

        .playlist-item {
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            color: #333;
            cursor: pointer;
            transition: background 0.2s;
        }

        .playlist-item:hover {
            background: #e8f5e9;
        }

        .playlist-item:last-child {
            border-bottom: none;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            margin-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .playlist-header h2 {
            color: #333;
            font-size: 18px;
            margin: 0;
        }

        #logoutBtn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        #logoutBtn:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Spotify Playlists</h1>
        <p class="subtitle">列出您的所有歌單為文字清單</p>

        <button id="loginBtn">登入 Spotify</button>

        <div id="playlistContainer" style="display: none;">
            <div class="user-info">
                <span>👤 </span><span id="userDisplay"></span>
            </div>
            <div class="playlist-header">
                <h2>您的歌單</h2>
                <button id="logoutBtn" onclick="logout()">登出</button>
            </div>
            <div id="playlistList"></div>
        </div>

        <div id="errorContainer"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
