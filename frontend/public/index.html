<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlists Lister</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        #loginBtn {
            width: 100%;
            padding: 12px;
            background: #1DB954;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        #loginBtn:hover {
            background: #1ed760;
        }

        #loginBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #playlistContainer {
            margin-top: 30px;
            display: none;
        }

        .user-info {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        #playlistList {
            background: #f7f7f7;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .loading {
            text-align: center;
            color: #999;
            font-style: italic;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #c62828;
        }

        .logoutBtn {
            margin-top: 20px;
            padding: 8px 16px;
            background: #eee;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logoutBtn:hover {
            background: #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Spotify Playlists</h1>
        <p class="subtitle">列出您的所有歌單為文字清單</p>

        <button id="loginBtn">登入 Spotify</button>

        <div id="playlistContainer" style="display: none;">
            <div class="user-info">
                <span>👤 </span><span id="userDisplay"></span>
            </div>
            <pre id="playlistList" class="loading">載入中...</pre>
            <button class="logoutBtn" onclick="logout()">登出</button>
        </div>

        <div id="errorContainer"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
